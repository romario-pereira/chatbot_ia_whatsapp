global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: 'simulation'
    static_configs:
      - targets: ['bot:8000']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 60s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 60s 